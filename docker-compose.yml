# SQL Server 2025 Vectors: Under the Hood and Into Production
# -----------------------------------------------------------------------------
# One `docker compose up` (via ./start.sh) gives you the full demo stack:
#
#   Host Ollama (GPU)  ◄──HTTP──  NGINX (TLS)  ◄──HTTPS──  SQL Server 2025
#                                                               │
#                                StackOverflow + VECTOR data ───┘
#
# Ollama runs on the HOST (GPU-accelerated, already downloaded). NGINX adds
# the TLS that SQL Server 2025's EXTERNAL MODEL requires and reverse-proxies
# to host Ollama. SQL Server is restored and fully vectorized automatically.
#
# Services
# ─────────────────────────────────────────────────────────────────────────────
#   config      one-shot: generates the self-signed TLS cert for NGINX
#   model-web   NGINX: terminates TLS on :443, proxies to host Ollama :11434
#   sql1        SQL Server 2025: StackOverflow, VECTOR type, DiskANN index
#   sql-init    one-shot: restores DB, embeds questions, builds index, creates
#               procs and logins used by the demos and rag-app.py

services:

  # ── 1. Generate the self-signed TLS cert ─────────────────────────────────
  # SQL Server 2025 only calls embedding endpoints over HTTPS, so NGINX sits
  # in front of host Ollama. The cert is generated once and reused — do NOT
  # regenerate on every compose-up (SQL Server trusts the cert by file hash;
  # a new cert after startup breaks the TLS handshake until sql1 restarts).
  # Delete certs/nginx.crt + certs/nginx.key to force a fresh cert.
  config:
    build:
      context: .
      dockerfile: dockerfile.ssl
    volumes:
      - "./certs/:/certs/"
    command: sh /certs/generate_ssl.sh

  # ── 2. NGINX TLS reverse proxy ────────────────────────────────────────────
  # Terminates TLS on :443 and forwards plain HTTP to host Ollama at
  # host.docker.internal:11434. The SQL Server EXTERNAL MODEL points here.
  model-web:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host's Ollama from container
    ports:
      - "443:443"
    volumes:
      - "./config/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./certs:/etc/nginx/certs:ro"
    networks:
      - app_network

  # ── 3. SQL Server 2025 ────────────────────────────────────────────────────
  # Vector data type, AI_GENERATE_EMBEDDINGS, VECTOR_DISTANCE, VECTOR_SEARCH,
  # and DiskANN vector indexes all live here.
  sql1:
    platform: linux/amd64                             # runs under Rosetta on Apple Silicon
    image: mcr.microsoft.com/mssql/server:2025-latest # CU1+ required for Apple Silicon AVX fix
    container_name: sql1
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully
      model-web:
        condition: service_started
    hostname: sql1
    networks:
      - app_network
    ports:
      - "1435:1433"    # use 1435 externally to avoid conflicts with other local SQL instances
    volumes:
      - sql-data:/var/opt/mssql
      # Mount the NGINX cert into SQL Server's trusted CA store so the
      # HTTPS call to the embedding endpoint (EXTERNAL MODEL) is trusted.
      - "./certs/nginx.crt:/var/opt/mssql/security/ca-certificates/public.crt:ro"
      - "./backups:/var/opt/mssql/backups/"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=S0methingS@Str0ng!   # demo only — throwaway password
      - MSSQL_PID=Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"S0methingS@Str0ng!\" -C -l 5 -t 5 -h -1 -Q \"SET NOCOUNT ON; SELECT 'PROBEOK'\" 2>/dev/null | grep -q '^PROBEOK$$'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── 4. One-shot database init ─────────────────────────────────────────────
  # Waits for sql1 to be healthy, then runs setup/init.sql which:
  #   - Restores the StackOverflowMini database
  #   - Enables external REST endpoint
  #   - Creates the EXTERNAL MODEL (pointing at NGINX → host Ollama)
  #   - Creates the EMBEDDINGS filegroup + QuestionEmbeddings table
  #   - Generates embeddings for top 1,000 questions via AI_GENERATE_EMBEDDINGS
  #   - Builds the DiskANN CREATE VECTOR INDEX
  #   - Creates stored procedures and least-privilege logins for the demos
  # Exits 0 when done. Re-running is safe (script is idempotent).
  sql-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql-tools
    container_name: sql-init
    restart: "no"
    depends_on:
      sql1:
        condition: service_healthy
      model-web:
        condition: service_started
    networks:
      - app_network
    volumes:
      - ./setup:/setup:ro
    entrypoint: >
      /bin/bash -c "
        echo 'SQL Server healthy — running setup/init.sql...';
        /opt/mssql-tools/bin/sqlcmd -S sql1 -U sa -P 'S0methingS@Str0ng!' -b -i /setup/init.sql || { echo 'Init FAILED.'; exit 1; };
        echo 'Init complete.'"

  # ── 5. Python RAG app (optional, profile "app") ───────────────────────────
  # Runs rag-app.py / rag-app-ui.py with the ODBC driver inside Linux, so the
  # host needs no ODBC driver or OpenSSL setup. Not started by `up` by default:
  #   docker compose run --rm rag-app python demos/rag-app.py "your question"
  #   docker compose --profile app up rag-app-ui      # http://localhost:8501
  rag-app: &rag-app
    profiles: ["app"]
    build:
      context: .
      dockerfile: dockerfile.app
    depends_on:
      sql1:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host's Ollama for generation
    environment:
      - SQL_SERVER=sql1,1433
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - app_network

  rag-app-ui:
    <<: *rag-app
    ports:
      - "8501:8501"
    command: streamlit run demos/rag-app-ui.py --server.address 0.0.0.0 --server.port 8501 --server.headless true

networks:
  app_network:

volumes:
  sql-data:
