worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream ollama {
        server host.docker.internal:11434;  # Ollama running on the HOST (GPU-accelerated)
    }

    # Bulk loads only (setup/build-scale-db.sh): four Ollama instances on the
    # host, 11434-11437, started by setup/ollama-lb.sh. least_conn sends each
    # request to the least busy one. Based on github.com/nocentino/ollama-lb-sql.
    upstream ollama_pool {
        least_conn;
        server host.docker.internal:11434;
        server host.docker.internal:11435;
        server host.docker.internal:11436;
        server host.docker.internal:11437;
        keepalive 256;
    }

    server {
        listen 443 ssl;
        server_name model-web;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://ollama;
            proxy_http_version 1.1;
            # Host Ollama rejects non-localhost Host headers (DNS-rebinding guard,
            # HTTP 403). Send localhost so the host daemon accepts the request.
            proxy_set_header Host              localhost;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin            '';
            proxy_set_header Referer           '';
        }
    }

    # :444 is the load-balanced endpoint for bulk embedding. The demos stay on
    # :443, so they never depend on the extra Ollama instances.
    server {
        listen 444 ssl;
        server_name model-web;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://ollama_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";   # keep upstream connections open
            proxy_set_header Host              localhost;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin            '';
            proxy_set_header Referer           '';
            proxy_read_timeout    600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
        }
    }
}
